table:
  name: league_teams
  schema: public
object_relationships:
  - name: season
    using:
      foreign_key_constraint_on: season_id
array_relationships:
  - name: league_roster_changes
    using:
      foreign_key_constraint_on:
        column: team_id
        table:
          name: league_roster_changes
          schema: public
  - name: league_sub_requests
    using:
      foreign_key_constraint_on:
        column: team_id
        table:
          name: league_sub_requests
          schema: public
  - name: league_team_players
    using:
      foreign_key_constraint_on:
        column: team_id
        table:
          name: league_team_players
          schema: public
